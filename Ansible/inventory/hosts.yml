---
# Group names "k3s_cluster", "server" and "agent" are the ones expected by
# the k3s.orchestration collection.
#
# All three nodes are servers: with >1 server k3s uses embedded etcd (HA control
# plane, tolerates 1 node down), and k3s servers also run regular workloads, so
# every node is both control plane and worker. node1 bootstraps the cluster.
k3s_cluster:
  children:
    server:
      hosts:
        node1:
          ansible_host: instance-gdxjn-k3s-node1.tenant-s360540
        node2:
          ansible_host: instance-gdxjn-k3s-node2.tenant-s360540
        node3:
          ansible_host: instance-gdxjn-k3s-node3.tenant-s360540
    agent:
      hosts: {}  # add worker-only nodes here if ever needed

  vars:
    # --- Connection (CrownLabs VMs are only reachable through the bastion) ---
    ansible_user: crownlabs
    ansible_ssh_common_args: "-J bastion@ssh-preprod.crownlabs.polito.it"

    # --- k3s ---
    k3s_version: v1.37.2+k3s1
    # No `token` set: the first server generates one and agents read it from there.

    # Agents join the server through its CrownLabs DNS name (stable across
    # VM restarts, unlike the IP). Use the fully-qualified name: inside the VMs
    # the short "<instance>.<tenant>" form does not resolve reliably.
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] }}.svc.crowng"

    # Fedora has SELinux enforcing: the install script adds the k3s-selinux RPM,
    # and k3s must be told to run with SELinux support.
    #
    # flannel-backend: the default VXLAN overlay (UDP 8472) does not work between
    # CrownLabs VMs (pod-to-pod traffic across nodes is dropped), while plain UDP
    # passes. WireGuard (UDP 51820) works and also encrypts inter-node traffic.
    server_config_yaml: |
      selinux: true
      flannel-backend: wireguard-native
      write-kubeconfig-mode: "0644"
      tls-san:
        - "{{ api_endpoint }}"
    agent_config_yaml: |
      selinux: true
