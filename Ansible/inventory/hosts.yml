---
# Group names "k3s_cluster", "server" and "agent" are the ones expected by
# the k3s.orchestration collection.
#
# All three nodes are servers: with >1 server k3s uses embedded etcd (HA control
# plane, tolerates 1 node down), and k3s servers also run regular workloads, so
# every node is both control plane and worker. node1 bootstraps the cluster.
k3s_cluster:
  children:
    server:
      hosts:
        node1:
          ansible_host: "instance-{{ crownlabs_instance }}-k3s-node1.{{ crownlabs_tenant }}"
          overlay_ip: 10.99.0.1
        node2:
          ansible_host: "instance-{{ crownlabs_instance }}-k3s-node2.{{ crownlabs_tenant }}"
          overlay_ip: 10.99.0.2
        node3:
          ansible_host: "instance-{{ crownlabs_instance }}-k3s-node3.{{ crownlabs_tenant }}"
          overlay_ip: 10.99.0.3
    agent:
      hosts: {}  # add worker-only nodes here if ever needed

  vars:
    # --- CrownLabs instance ---
    # ID of the current CrownLabs instance (changes when the instance is
    # recreated) and the tenant namespace; used to build every node's hostname.
    crownlabs_instance: wpp59
    crownlabs_tenant: tenant-s360540
    # Suffix of the fully-qualified CrownLabs DNS names: inside the VMs the short
    # "<instance>.<tenant>" form does not resolve reliably.
    crownlabs_dns_suffix: svc.crowng

    # --- Connection (CrownLabs VMs are only reachable through the bastion) ---
    ansible_user: crownlabs
    ansible_ssh_common_args: "-J bastion@ssh-preprod.crownlabs.polito.it"
    # Extra public keys allowed to log in as ansible_user (see ssh-keys.yml).
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEPlHKVy/e8gzrbWgzpb3om6vvD6a6SxvCF/CGqAxDQB matteominin@MacBook-Pro-3.local

    # --- k3s ---
    k3s_version: v1.37.2+k3s1
    # No `token` set: the first server generates one and agents read it from there.

    # --- Overlay (see overlay-network.yml) ---
    # k3s and etcd run on the fixed overlay addresses (`overlay_ip` above), not
    # on the VM IPs, which change when CrownLabs restarts a VM. Nodes join the
    # first server through its overlay address.
    api_endpoint: "{{ hostvars[groups['server'][0]]['overlay_ip'] }}"
    # UDP port of the FOU tunnels (IP-IP and GRE are dropped between VMs).
    overlay_fou_port: 5555

    # Fedora has SELinux enforcing: the install script adds the k3s-selinux RPM,
    # and k3s must be told to run with SELinux support.
    #
    # flannel-backend: the default VXLAN overlay (UDP 8472) does not work between
    # CrownLabs VMs (pod-to-pod traffic across nodes is dropped), while plain UDP
    # passes. WireGuard (UDP 51820) works and also encrypts inter-node traffic.
    server_config_yaml: |
      selinux: true
      flannel-backend: wireguard-native
      write-kubeconfig-mode: "0644"
      node-ip: "{{ overlay_ip }}"
      flannel-iface: "{{ k3s_flannel_iface }}"
      tls-san:
        - "{{ api_endpoint }}"
        - "{{ ansible_host }}.{{ crownlabs_dns_suffix }}"
    agent_config_yaml: |
      selinux: true
      node-ip: "{{ overlay_ip }}"
      flannel-iface: "{{ k3s_flannel_iface }}"
    # Flannel takes its address and MTU from this interface. Any of the node's
    # tunnels works (they all carry `overlay_ip`, routing picks the right one);
    # without it flannel would use the default-route interface and its VM IP.
    k3s_flannel_iface: "ovl-{{ groups['k3s_cluster'] | reject('equalto', inventory_hostname) | first }}"
