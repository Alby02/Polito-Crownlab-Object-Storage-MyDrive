[defaults]
inventory = inventory/hosts.yml
# Install collections inside the project (see requirements.yml) instead of ~/.ansible
collections_path = ./collections
interpreter_python = auto_silent
forks = 10

[ssh_connection]
# Reuse SSH connections: every node is reached through the CrownLabs bastion,
# so opening a fresh connection per task would be slow.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
