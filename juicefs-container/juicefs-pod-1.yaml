apiVersion: v1
kind: Pod
metadata:
  name: juicefs-app-1
  namespace: default
spec:
  containers:
  - command:
    - /bin/sh
    - -c
    - sleep infinity
    image: centos:centos7.9.2009
    name: app
    volumeMounts:
    - mountPath: /data
      name: juicefs-pv
      mountPropagation: HostToContainer
  volumes:
  - name: juicefs-pv
    persistentVolumeClaim:
      claimName: juicefs-pvc