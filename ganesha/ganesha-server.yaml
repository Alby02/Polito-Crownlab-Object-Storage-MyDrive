
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganesha-server
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ganesha-server
  template:
    metadata:
      labels:
        app: ganesha-server
    spec:
      containers:
        - name: ganesha
          image: ghcr.io/kubernetes-sigs/nfs-ganesha:v6.5
          command:
            - /usr/local/bin/ganesha.nfsd
          args:
            - -F
            - -L
            - STDOUT
            - -f
            - /etc/ganesha/ganesha.conf
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - DAC_READ_SEARCH
          ports:
            - containerPort: 2049
              name: nfs
              protocol: TCP
          volumeMounts:
            - name: juicefs
              mountPath: /export
            - name: config
              mountPath: /etc/ganesha/ganesha.conf
              subPath: ganesha.conf
            - name: ganesha-run
              mountPath: /usr/local/var/run/ganesha
      volumes:
        - name: juicefs
          persistentVolumeClaim:
            claimName: juicefs-pvc
        - name: ganesha-run
          emptyDir: {}
        - name: config
          configMap:
            name: ganesha-config
---
apiVersion: v1
kind: Service
metadata:
  name: ganesha-nfs
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ganesha-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
