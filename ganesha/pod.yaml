apiVersion: v1
kind: Pod
metadata:
  name: ganesha-probe
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: ganesha
      image: ghcr.io/kubernetes-sigs/nfs-ganesha:v6.5
      command:
        - /bin/sh
        - -c
        - sleep 36000
      securityContext:
        runAsUser: 0
        capabilities:
          add:
            - DAC_READ_SEARCH
      volumeMounts:
        - name: juicefs
          mountPath: /export
  volumes:
    - name: juicefs
      persistentVolumeClaim:
        claimName: juicefs-pvc
