NFS_CORE_PARAM {
    Protocols = 4;
    Enable_UDP = false;
    Enable_RQUOTA = false;
    allow_set_io_flusher_fail = true;
}

NFSv4 {
    Graceless = true;
}

EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /juicefs;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;

    FSAL {
        Name = VFS;
    }
}