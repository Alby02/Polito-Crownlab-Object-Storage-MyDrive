# Credentials of the "juicefs" database owner, used by initdb at bootstrap.
# Changing the password later does NOT update it in PostgreSQL by itself:
# CNPG reconciles it from this Secret, but the JuiceFS metaurl must match.
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-meta-credentials
type: kubernetes.io/basic-auth
stringData:
  username: juicefs
  password: {{ required "password is required (juicefs.meta.password in backend.yaml)" .Values.password | quote }}
