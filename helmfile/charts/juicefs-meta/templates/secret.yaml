# One login per JuiceFS filesystem. CNPG creates each role from its Secret
# (spec.managed.roles in cluster.yaml) and, with the reload label, updates the
# password in PostgreSQL when the Secret changes. The client's metaurl must
# then be updated to match.
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-meta-credentials
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: juicefs
  password: {{ required "password is required (juicefs.meta.password in backend.yaml)" .Values.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-guest-meta-credentials
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: juicefs_guest
  password: {{ required "guestPassword is required (juicefsGuest.meta.password in backend.yaml)" .Values.guestPassword | quote }}
