# Copy to backend.yaml (git-ignored) and fill in.
juicefs:
  name: juicefs                              # filesystem name (prefix inside the bucket)
  meta:
    # Password of the "juicefs" PostgreSQL user (juicefs-meta cluster).
    # Alphanumeric only (it goes into the metaurl unescaped), e.g.:
    #   openssl rand -hex 24
    password: <password>
  storage: s3
  # Bucket in the in-cluster RustFS; created automatically if missing.
  bucket: http://rustfs-svc.rustfs.svc.cluster.local:9000/juicefs
  # Same pair as rustfs.accessKey / rustfs.secretKey below.
  accessKey: <access-key>
  secretKey: <secret-key>

rustfs:
  # Root credentials of the in-cluster RustFS (also its console login), e.g.:
  #   openssl rand -hex 10   /   openssl rand -hex 24
  accessKey: <access-key>
  secretKey: <secret-key>
  driveSize: 10Gi                            # per drive, 1 drive per node
