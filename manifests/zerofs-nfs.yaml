# ZeroFS exporting a shared folder over NFS (NFSv3, TCP 2049; mountd on the
# same port). ZeroFS is a filesystem by itself: it stores its data directly in
# S3 (the in-cluster RustFS, bucket "zerofs", prefix "nfs"), not on a PVC.
# The "zerofs" bucket must exist before the first start: create it by hand.
#
# Needs the zerofs-credentials Secret (see zerofs-credentials.example.yaml).
#
#   kubectl apply -f manifests/zerofs-nfs.yaml
#
# Client (pod or VM, needs nfs-utils):
#   mount -t nfs -o vers=3,async,nolock,tcp,port=2049,mountport=2049,hard,rsize=1048576,wsize=1048576 \
#     zerofs-nfs.default.svc.cluster.local:/ /mnt/nfs
# Note: over NFS, ZeroFS acknowledges writes before they reach S3 (fsync is not
# durable); over 9P it is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zerofs-nfs-config
  namespace: default
data:
  zerofs.toml: |
    [cache]
    dir = "/cache"
    disk_size_gb = 4.0
    memory_size_gb = 0.5

    [storage]
    url = "s3://zerofs/nfs"
    encryption_password = "${ZEROFS_PASSWORD}"

    [servers.nfs]
    addresses = ["0.0.0.0:2049"]

    [aws]
    access_key_id = "${AWS_ACCESS_KEY_ID}"
    secret_access_key = "${AWS_SECRET_ACCESS_KEY}"
    endpoint = "http://rustfs-svc.rustfs.svc.cluster.local:9000"
    default_region = "us-east-1"
    allow_http = "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerofs-nfs
  namespace: default
spec:
  replicas: 1
  # ZeroFS is single-writer on its S3 prefix: stop the old pod before the new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zerofs-nfs
  template:
    metadata:
      labels:
        app: zerofs-nfs
    spec:
      # The image runs as uid 1001: make the cache volume writable for it
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: zerofs
          image: ghcr.io/barre/zerofs:2.3.7
          args: ["run", "-c", "/config/zerofs.toml"]
          envFrom:
            - secretRef:
                name: zerofs-credentials
          ports:
            - containerPort: 2049
              name: nfs
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: nfs
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /cache
      volumes:
        - name: config
          configMap:
            name: zerofs-nfs-config
        # Local cache only: the data is in S3
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zerofs-nfs
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: zerofs-nfs
  ports:
    - name: nfs
      port: 2049
      targetPort: nfs
      protocol: TCP
