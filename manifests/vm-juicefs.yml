apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt.io/os: linux
  name: vm-juicefs
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-juicefs
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: disk0
            - cdrom:
                bus: sata
                readonly: true
              name: cloudinitdisk
          # Masquerade (NAT behind the pod IP): required for live migration,
          # the default bridge binding is not migratable.
          interfaces:
            - name: default
              masquerade: {}
          # JuiceFS PVC exposed to the guest through VirtioFS (mount tag: juicefs)
          filesystems:
            - name: juicefs
              virtiofs: {}
        machine:
          type: q35
        resources:
          requests:
            memory: 2048M
      networks:
        - name: default
          pod: {}
      volumes:
        # Root disk: the Fedora Cloud image shipped as a container image,
        # shared read-only by all VMs on a node. Writes go to a local overlay
        # and are lost when the VM stops: cloud-init runs again on every boot.
        # Keep the shared data on /mnt/drive.
        - name: disk0
          containerDisk:
            image: quay.io/containerdisks/fedora:45-1.4
        - name: juicefs
          persistentVolumeClaim:
            claimName: juicefs-pvc
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vm-juicefs
              ssh_pwauth: True
              disable_root: false
              ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEPlHKVy/e8gzrbWgzpb3om6vvD6a6SxvCF/CGqAxDQB matteominin@MacBook-Pro-3.local
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM0DTfJTuqEhIc1lkSmVrbzhi4fAzc/n2Xe+QRAydMW0 user@DESKTOP-8D9RM1A
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIABl4EEG7Cn8qHdNJeZtJZWcMuuMGmmdWoi4cglyI0nd alberto@DESKTOP-8D9RM1A
              # virtiofsd runs as qemu (uid/gid 107) in virt-launcher: every file on
              # the share is owned by 107, so only root could write to /mnt/juicefs.
              # bindfs re-exposes it at ~/drive with 107 shown as the fedora user
              # (1000); new files are still stored as 107 on JuiceFS.
              packages:
              - bindfs
              - fuse
              # The JuiceFS volume (tag = filesystem name above): virtiofs is in
              # the kernel, so it can be mounted right away.
              mounts:
              - [juicefs, /mnt/juicefs, virtiofs, "defaults,nofail", "0", "0"]
              # The remapped view for the fedora user, added to fstab only after
              # the packages are installed (defer): in `mounts`, cloud-init would
              # run `mount -a` before bindfs is there and fail.
              write_files:
              - path: /etc/fstab
                append: true
                defer: true
                content: |
                  /mnt/juicefs /mnt/drive fuse.bindfs map=107/1000:@107/@1000,x-systemd.requires-mounts-for=/mnt/juicefs,nofail 0 0
              runcmd:
              - mkdir -p /mnt/drive
              - mount /mnt/drive
