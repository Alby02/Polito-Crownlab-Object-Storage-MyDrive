# vm-nfs-ganesha: same shared folder as vm-juicefs, but reached over NFSv4 through NFS-Ganesha
# (manifests/ganesha-nfs-server.yaml) instead of VirtioFS. The VM has no PVC of the
# shared volume: only its own root disk.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt.io/os: linux
  name: vm-nfs-ganesha
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: vm-nfs-ganesha-rootdisk
      spec:
        storage:
          storageClassName: juicefs-sc
          # RWX: live migration attaches the disk on both nodes during the move
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 7Gi
        source:
          http:
            url: "https://download.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/Fedora-Cloud-Base-AmazonEC2-45-1.4.x86_64.raw.xz"
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-nfs-ganesha
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: disk0
            - cdrom:
                bus: sata
                readonly: true
              name: cloudinitdisk
          # Masquerade (NAT behind the pod IP): required for live migration.
          # The guest gets the pod's DNS settings, so it resolves cluster
          # Service names.
          interfaces:
            - name: default
              masquerade: {}
        machine:
          type: q35
        resources:
          requests:
            memory: 2048M
      networks:
        - name: default
          pod: {}
      volumes:
        - name: disk0
          dataVolume:
            name: vm-nfs-ganesha-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vm-nfs-ganesha
              ssh_pwauth: True
              disable_root: false
              ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEPlHKVy/e8gzrbWgzpb3om6vvD6a6SxvCF/CGqAxDQB matteominin@MacBook-Pro-3.local
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM0DTfJTuqEhIc1lkSmVrbzhi4fAzc/n2Xe+QRAydMW0 user@DESKTOP-8D9RM1A
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIABl4EEG7Cn8qHdNJeZtJZWcMuuMGmmdWoi4cglyI0nd alberto@DESKTOP-8D9RM1A
              # mount.nfs4 helper
              packages:
              - nfs-utils
              # Ganesha squashes every user to 107 (see ganesha-nfs-server.yaml), so
              # the fedora user can write without any remapping in the guest.
              # hard: on a server restart, I/O waits instead of failing.
              mounts:
              - [ "ganesha-nfs.default.svc.cluster.local:/juicefs", /mnt/drive, nfs4, "hard,_netdev,nofail", "0", "0" ]
              # On first boot the fstab entry is written before nfs-utils is
              # installed: mount it once here (later boots use fstab).
              runcmd:
              - mkdir -p /mnt/drive
              - mount /mnt/drive
