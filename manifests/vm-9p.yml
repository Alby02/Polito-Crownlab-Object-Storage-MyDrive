# vm-9p: the ZeroFS 9P share (manifests/zerofs-9p.yaml) mounted at /mnt/drive.
# This is ZeroFS's own filesystem (data in S3), not the JuiceFS folder of
# vm-juicefs / vm-nfs-ganesha.
#
# fstab can't be used: the kernel 9p client takes an IP address, not a
# hostname, and the Service IP has to be looked up first. A systemd unit
# resolves it and mounts at every boot.
# If the mount fails with "unknown filesystem type '9p'", the guest kernel
# lacks the 9p modules: dnf install kernel-modules-$(uname -r)
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    kubevirt.io/os: linux
  name: vm-9p
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: vm-9p-rootdisk
      spec:
        storage:
          storageClassName: juicefs-sc
          # RWX: live migration attaches the disk on both nodes during the move
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 7Gi
        source:
          http:
            url: "https://download.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/Fedora-Cloud-Base-AmazonEC2-45-1.4.x86_64.raw.xz"
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-9p
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: disk0
            - cdrom:
                bus: sata
                readonly: true
              name: cloudinitdisk
          # Masquerade (NAT behind the pod IP): required for live migration.
          # The guest gets the pod's DNS settings, so it resolves cluster
          # Service names.
          interfaces:
            - name: default
              masquerade: {}
        machine:
          type: q35
        resources:
          requests:
            memory: 2048M
      networks:
        - name: default
          pod: {}
      volumes:
        - name: disk0
          dataVolume:
            name: vm-9p-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: vm-9p
              ssh_pwauth: True
              disable_root: false
              ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEPlHKVy/e8gzrbWgzpb3om6vvD6a6SxvCF/CGqAxDQB matteominin@MacBook-Pro-3.local
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM0DTfJTuqEhIc1lkSmVrbzhi4fAzc/n2Xe+QRAydMW0 user@DESKTOP-8D9RM1A
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIABl4EEG7Cn8qHdNJeZtJZWcMuuMGmmdWoi4cglyI0nd alberto@DESKTOP-8D9RM1A
              write_files:
              - path: /usr/local/sbin/mount-zerofs-9p
                permissions: "0755"
                content: |
                  #!/bin/sh
                  HOST=zerofs-9p.default.svc.cluster.local
                  OPTS=trans=tcp,port=5564,version=9p2000.L,cache=mmap,access=user,msize=1048576
                  mkdir -p /mnt/drive
                  until IP=$(getent hosts "$HOST" | awk '{print $1; exit}') && [ -n "$IP" ] \
                        && mount -t 9p -o "$OPTS" "$IP" /mnt/drive; do
                    echo "mount failed, retrying in 5s"; sleep 5
                  done
                  # ZeroFS does not squash users and its root starts owned by
                  # root: hand it to the fedora user (1000) so it can write.
                  chown 1000:1000 /mnt/drive
              - path: /etc/systemd/system/zerofs-9p-mount.service
                content: |
                  [Unit]
                  Description=Mount the ZeroFS 9P share on /mnt/drive
                  Wants=network-online.target
                  After=network-online.target

                  [Service]
                  Type=oneshot
                  RemainAfterExit=yes
                  ExecStart=/usr/local/sbin/mount-zerofs-9p
                  ExecStop=/usr/bin/umount -l /mnt/drive

                  [Install]
                  WantedBy=multi-user.target
              runcmd:
              - systemctl daemon-reload
              - systemctl enable --now --no-block zerofs-9p-mount.service
