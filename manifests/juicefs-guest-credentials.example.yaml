# Settings of the "guest" JuiceFS filesystem: the one mounted by the JuiceFS
# client itself, inside a VM (vm-juicefs-guest.yml) or in a pod sidecar
# (pod-juicefs-sidecar.yaml). Both read this Secret, so they see the same files.
# Copy to juicefs-guest-credentials.yaml (git-ignored), fill in, then:
#   kubectl apply -f manifests/juicefs-guest-credentials.yaml
#
# The pod reads the keys as environment variables; the VM gets them as files on
# an extra disk (see vm-juicefs-guest.yml). Either way the client holds them:
# a user with root in the VM can read them.
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-guest-credentials
  namespace: default
type: Opaque
stringData:
  # Its own database and login (juicefs_guest), separate from the CSI driver's.
  # The password is juicefsGuest.meta.password from helmfile/backend.yaml.
  META_URL: postgres://juicefs_guest:<password>@juicefs-meta-rw.juicefs.svc.cluster.local:5432/juicefs_guest?sslmode=require
  # Filesystem name, and the bucket in RustFS (create the bucket first).
  NAME: juicefs-guest
  BUCKET: http://rustfs-svc.rustfs.svc.cluster.local:9000/<bucket>
  # A RustFS key pair allowed to use that bucket.
  ACCESS_KEY: <access-key>
  SECRET_KEY: <secret-key>
