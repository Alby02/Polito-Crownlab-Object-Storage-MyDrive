# Credentials of the ZeroFS servers (zerofs-9p.yaml, zerofs-nfs.yaml).
# Copy to zerofs-credentials.yaml (git-ignored), fill in, then:
#   kubectl apply -f manifests/zerofs-credentials.yaml
#
# Each key becomes an environment variable of the ZeroFS container, and
# zerofs.toml reads it as ${NAME}.
apiVersion: v1
kind: Secret
metadata:
  name: zerofs-credentials
  namespace: default
type: Opaque
stringData:
  # S3 login for RustFS: the rustfs.accessKey / rustfs.secretKey pair in
  # helmfile/backend.yaml (or any RustFS user allowed to use the "zerofs" bucket).
  AWS_ACCESS_KEY_ID: <access-key>
  AWS_SECRET_ACCESS_KEY: <secret-key>
  # Encrypts the data ZeroFS writes to S3. Generate it once, e.g.:
  #   openssl rand -hex 24
  # Keep a copy: if it changes or is lost, the existing data can't be read.
  ZEROFS_PASSWORD: <password>
